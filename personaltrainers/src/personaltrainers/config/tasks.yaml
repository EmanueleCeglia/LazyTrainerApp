fetch_exercises:
  description: >
    Given the user request: **{user_request}**, output **ONLY** the SQL WHERE clause.
    (including the word `WHERE`, no trailing semicolon, 
    no back-ticks, no comments, no other text). 

    Your output must be an SQL query like the one delimited by triple backtics. \
    If a column has no values drop it

    Please note:
    If there is not a specific equipments specified in the prompt you MUST not filter on equipments
    
    Example in case of no equipments:
    WHERE
        body_region IN () AND 
        (
        muscles LIKE '%muscle_name%' OR
        muscles LIKE '%muscle_name%' ...
        )
    
    Example in case of equipments available:
    WHERE
        body_region IN () AND 
        (
        equipments LIKE '%equipment_name%' OR 
        equipments LIKE '%equipment_name%' ...
        )
        AND
        (
        muscles LIKE '%muscle_name%' OR
        muscles LIKE '%muscle_name%' ...
        )

    Possible values:

    body_region: 'upper body', 'lower body' 
    muscles: 'chest', 'shoulders', 'tricpes', 'lats', 'biceps', 'quads', 'harmstrings', 'glutes', 'calves'
    equipments: 'gymnastics rings, parallel bars, parallettes, pull-up bar, barbell, dumbells, kettlebell, ground'

    End possible values.

    Please note:
    If there is not a specific equipments specified in the prompt you MUST not filter on equipments
    If there are not muscles specified in the prompt you MUST not filter on muscles

  expected_output: >
    A single-line WHERE clause as plain text.

  agent: sql_query_generator


