fetch_exercises:
  description: >
    Given the user request: **{user_request}**, output **ONLY** the SQL WHERE clause.
    (including the word `WHERE`, no trailing semicolon, 
    no back-ticks, no comments, no other text). 

    Your output must be an SQL query like the one delimited by triple backtics. \
    If a column has no values drop it

    Please note:
    If there is not a specific equipments specified in the prompt you MUST not filter on equipments
    
    Example in case of no equipments:
    WHERE
        body_region IN () AND 
        (
        muscles LIKE '%muscle_name%' OR
        muscles LIKE '%muscle_name%' ...
        )
    
    Example in case of equipments available:
    WHERE
        body_region IN () AND 
        (
        equipments LIKE '%equipment_name%' OR 
        equipments LIKE '%equipment_name%' ...
        )
        AND
        (
        muscles LIKE '%muscle_name%' OR
        muscles LIKE '%muscle_name%' ...
        )

    Possible values:

    body_region: 'upper body', 'lower body' 
    muscles: 'chest', 'shoulders', 'tricpes', 'lats', 'biceps', 'quads', 'harmstrings', 'glutes', 'calves'
    equipments: 'gymnastics rings, parallel bars, parallettes, pull-up bar, barbell, dumbells, kettlebell, ground'

    End possible values.

    Please note:
    If there is not a specific equipments specified in the prompt you MUST not filter on equipments
    If there are not muscles specified in the prompt you MUST not filter on muscles

  expected_output: >
    A single-line WHERE clause as plain text.

  agent: sql_query_generator


select_exercises:
  description: |
    You are an expert strength-training coach and exercise-library curator.

    **Inputs**

    1. **{user_needs}** – free-text summary of the athlete's goal, level
       (Beginner / Intermediate / Advanced), session duration, focus
       (upper-body, lower-body, etc.), available equipment and any
       limitations.
    2. **exercises** – list of dictionaries from #name		movement_type	body_region	load_class	muscles	equipments
       `{{tasks.run_query.pydantic.exercises}}`, each containing at least:
         - name
         - movement_pattern         
         - movement_type   
         - body_region     
         - load_class   
         - muscles
         - equipments

    **Task**

    Return the subset of *exercises* that best matches *user_needs*,
    in the order they should be performed. **Never invent or rename an exercise.**

    **Selection rules (apply in order)**

    1. **Session length** – choose a total that fits the planned duration  
       • ≈ 4 – 6 exercises → 60 – 90 min sessions  
       • ≈ 6 – 9 exercises → ≥ 120 min sessions  
       (If the pool is smaller than these targets, include every exercise.)

    2. **Full-body coverage** – whenever both upper-body **and** lower-body
      movements exist in the pool, treat the program as full-body and select
       at least one exercise for each region (upper + lower).  
       *Never* drop an entire region unless the user explicitly rules it out.
    3. **Difficulty vs. level**
       - Beginner → favour `load_class ∈ {machine, bodyweight}`.
       - Intermediate → mix in more free-weight / medium-skill lifts.
       - Advanced → free to include the most technical / heavy variations.
    4. **Ordering**
       - Start with compound movements, then isolation.
       - For full-body programs, place lower-body compounds first.
    5. **Upper-body balance** – when the session is upper-body focused,
       alternate *push* ↔ *pull* patterns and cover both **horizontal** and **vertical** planes when possible.
    6. **Coverage** – unless explicitly requested, do **not** output only compounds or only isolations.

    **Output**

    Respond with **only** a JSON-serialisable Python list of the selected
    exercise dictionaries, in the exact execution order – no extra keys, no prose.

  expected_output: |
    [
      {"name": "v-push ups", "movement_pattern": "vertical push", ...},
      ...
    ]

  agent: esercises_selector


