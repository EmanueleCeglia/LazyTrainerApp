generate_protocols:
  description: |
    You are an expert strength-training coach and programming assistant.

    ---
    ## Inputs
    - **exercises**: A list of dictionaries from `{{tasks.select_exercises.pydantic.exercises}}`. 
    Each dictionary contains details about an exercise, including `name`, `movement_pattern`, `movement_type`, `body_region`, `load_class`, `muscles`, and `equipments`.

    - **{user_level}**: The level of the user

    ---
    ## Task
    For **each** exercise dictionary provided in the input:

    1.  **Select three distinct protocols** from the `Protocol Guidelines` table below that are well-suited to the exercise.
    2.  For each selection, create a new key-value pair in the exercise dictionary:
        -   **Key**: Use `prot_1`, `prot_2`, and `prot_3` for the three protocols.
        -   **Value**: A single string combining the protocol's **Name** and its corresponding **Prescription**, separated by a ` | ` (e.g., `"Reverse Pyramid | 3 sets × 8-6-4 reps (iso: 12-10-8)"`).
    3.  Apply the **Heuristics** provided below to make logical choices. You may override the typical prescriptions when it makes sense for a specific exercise.
    4.  Do not delete or rename any existing keys.

    ---
    ## Protocol Guidelines

    | Protocol Name                     | Typical Prescription                    |
    | --------------------------------- | --------------------------------------- |
    | Straight Sets                     | 4 sets × 8 reps (iso: 3×12)             |
    | Ascending/Descending Pyramid      | 3 sets × 12-10-8 reps                   |
    | Reverse Pyramid                   | 3 sets × 8-6-4 reps (iso: 12-10-8)      |
    | Double Progression                | 3 sets × 6-8 reps until top of range    |
    | Wave Loading                      | 6 sets × 3 reps (e.g., 80-85-90%)       |
    | 5×5 Linear Progression            | 5 sets × 5 reps                         |
    | EMOM                              | 10 min × 3-5 reps per minute            |
    | AMRAP (bodyweight/machine)        | 2 sets × max reps                       |
    | AMRAP (free weight)               | 1 set × max reps ≤ 8                    |
    | Cluster Sets                      | 4 sets × (4×2 reps, :15 rest)           |
    | Rest-Pause                        | 1 set × max-reps + 2×RP                 |
    | Drop Sets                         | 1 set × 8 reps + 2×drops                |

    ---
    ## Heuristics
    - **Isolation**: Favor higher reps (≥10) and methods like Straight Sets, Ascending/Descending Pyramid, Drop Sets, and Rest-Pause.
    - **Compounds**: Lean towards strength-focused methods like 5x5, Reverse Pyramid, Wave Loading, Cluster Sets, and EMOM.
    - **Bodyweight**: Good candidates are AMRAP, EMOM, and Straight Sets.
    - **Machines**: Can handle higher total volume.
    - Modify the number of repetitions or sets depeding on the **user_level**

    ---
    ## Output
    Respond with **only** a JSON-serializable Python list of the modified dictionaries in the same order you received them. Do not include any extra text, markdown formatting, or wrapper objects.

  expected_output: |
    exercises = '[
      {
        "name": "pull ups",
        "movement_pattern": "vertical pull",
        …,
        "prot_1": "Reverse Pyramid | 3 sets 8-6-4 reps",
        "prot_2": "AMRAP | 1 set max reps ≤ 8",
        "prot_3": "5×5 Linear Progression | 5 sets 5 reps"
      },
      …
    ]'

  agent: protocols_generator

